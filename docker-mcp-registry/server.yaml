# servers and readme.md is the public README. Opened as docker/mcp-registry
# PR #5081 on 2026-09-13 from Kolmo-Construction:add-kolmo-construction; that
# branch still carries the pre-correction text until this file is pushed to it.
# No tool count in the description: the live server's count moves with every
# release (36 at PR time, 42 on 2026-10-13).
name: kolmo-construction
type: remote
meta:
  category: productivity
  tags:
    - construction
    - permits
    - washington
    - seattle
    - contractor
    - real-estate
about:
  title: Kolmo Construction
  description: >-
    Washington permit rules for King, Pierce and Snohomish County
    jurisdictions (each jurisdiction's own rule where Kolmo has read it, the
